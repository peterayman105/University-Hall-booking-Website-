<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Find Your Spot">
  <defs>
    <linearGradient id="shield" x1="80" y1="24" x2="80" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c872"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#9a7b1a"/>
    </linearGradient>
  </defs>

  <!-- Outer ring (seal style) -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="80" cy="80" r="70" fill="#f8f6f0"/>

  <!-- Laurel wreath hints -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity=".9">
    <path d="M28 88c8-18 22-30 40-34"/>
    <path d="M132 88c-8-18-22-30-40-34"/>
    <path d="M32 96c6 10 14 18 24 22"/>
    <path d="M128 96c-6 10-14 18-24 22"/>
  </g>

  <!-- Shield -->
  <path
    fill="url(#shield)"
    stroke="url(#gold)"
    stroke-width="2.5"
    d="M80 32 L118 48 V78 C118 98 80 118 80 118 C80 118 42 98 42 78 V48 Z"
  />

  <!-- Open book (academic) -->
  <g fill="none" stroke="#f8f6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 58h24v22H58z"/>
    <path d="M80 58v22"/>
    <path d="M82 58h24v22H82z"/>
    <path d="M62 64h14M84 64h14"/>
  </g>

  <!-- Hall columns / pediment -->
  <g fill="url(#gold)" opacity=".95">
    <rect x="62" y="86" width="5" height="18" rx="1"/>
    <rect x="76.5" y="86" width="5" height="18" rx="1"/>
    <rect x="91" y="86" width="5" height="18" rx="1"/>
    <path d="M56 86h48l-6-8H62z"/>
  </g>

  <!-- Monogram FYS -->
  <text
    x="80"
    y="108"
    text-anchor="middle"
    fill="#f8f6f0"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    FYS
  </text>

  <!-- Scroll banner -->
  <path
    fill="url(#gold)"
    d="M34 124c12 8 28 12 46 12s34-4 46-12c-4 6-22 10-46 10S38 130 34 124z"
  />
  <text
    x="80"
    y="134"
    text-anchor="middle"
    fill="#0f2744"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="7.5"
    font-weight="700"
    letter-spacing=".8"
  >
    FIND YOUR SPOT
  </text>
</svg>
